<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ImageClipper</title>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #0a0a0a;
      --surface: #111111;
      --surface2: #1a1a1a;
      --border: #2a2a2a;
      --fg: #f5f5f5;
      --muted: #888;
      --accent: #4a9eff;
      --radius: 10px;
      --shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif;
      background: var(--bg);
      color: var(--fg);
      min-height: 100vh;
      line-height: 1.5;
    }

    /* ── Header ── */
    header {
      border-bottom: 1px solid var(--border);
      background: rgba(10, 10, 10, 0.85);
      backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .header-inner {
      max-width: 900px;
      margin: 0 auto;
      padding: 0 24px;
      height: 56px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-icon {
      width: 32px;
      height: 32px;
      background: var(--fg);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      color: var(--bg);
    }

    .logo-icon svg {
      width: 18px;
      height: 18px;
    }

    .logo-text {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    /* ── Main ── */
    main {
      max-width: 900px;
      margin: 0 auto;
      padding: 48px 24px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    /* ── Hero ── */
    #hero {
      text-align: center;
      padding: 48px 0 16px;
    }

    #hero h2 {
      font-size: clamp(2rem, 5vw, 3.5rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.1;
      margin-bottom: 14px;
    }

    #hero p {
      font-size: 1.1rem;
      color: var(--muted);
      max-width: 480px;
      margin: 0 auto;
    }

    .highlight {
      color: var(--accent);
    }

    /* ── Drop Zone ── */
    #drop-zone {
      border: 2px dashed var(--border);
      border-radius: var(--radius);
      padding: 60px 32px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
      background: var(--surface);
    }

    #drop-zone:hover {
      border-color: var(--muted);
      background: var(--surface2);
    }

    #drop-zone.drag-over {
      border-color: var(--accent);
      background: var(--surface2);
      box-shadow: 0 0 0 4px rgba(74, 158, 255, 0.1);
    }

    .drop-icon {
      width: 48px;
      height: 48px;
      margin: 0 auto 16px;
      color: var(--muted);
    }

    .drop-title {
      font-size: 1.05rem;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .drop-sub {
      color: var(--muted);
      font-size: 0.875rem;
    }

    #file-input {
      display: none;
    }

    /* ── Controls Card ── */
    .controls-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 24px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 20px;
      justify-content: space-between;
    }

    .slider-group {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
      min-width: 180px;
    }

    .slider-label {
      font-size: 0.875rem;
      color: var(--muted);
      white-space: nowrap;
    }

    .parts-count {
      font-size: 1.25rem;
      font-weight: 700;
      min-width: 26px;
      text-align: center;
    }

    input[type='range'] {
      flex: 1;
      height: 4px;
      -webkit-appearance: none;
      appearance: none;
      background: var(--border);
      border-radius: 2px;
      outline: none;
      cursor: pointer;
    }

    input[type='range']::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 18px;
      height: 18px;
      background: var(--fg);
      border-radius: 50%;
      cursor: pointer;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.4);
      transition: transform 0.1s;
    }

    input[type='range']::-webkit-slider-thumb:hover {
      transform: scale(1.15);
    }

    .button-group {
      display: flex;
      gap: 10px;
      flex-shrink: 0;
    }

    /* ── Buttons ── */
    button {
      cursor: pointer;
      border: none;
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.875rem;
      font-weight: 600;
      padding: 9px 18px;
      transition: all 0.15s ease;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-ghost {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
    }

    .btn-ghost:hover:not(:disabled) {
      background: var(--surface2);
      color: var(--fg);
    }

    .btn-primary {
      background: var(--fg);
      color: var(--bg);
    }

    .btn-primary:hover:not(:disabled) {
      opacity: 0.9;
      transform: translateY(-1px);
    }

    .btn-primary:active:not(:disabled) {
      transform: translateY(0);
    }

    .btn-secondary {
      background: var(--surface2);
      color: var(--fg);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover:not(:disabled) {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    /* ── Preview ── */
    #preview-wrapper {
      position: relative;
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
      background: var(--surface);
      border: 1px solid var(--border);
    }

    #preview-img {
      display: block;
      width: 100%;
      height: auto;
      max-height: 55vh;
      object-fit: contain;
    }

    #split-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      pointer-events: none;
    }

    .split-segment {
      height: 100%;
      border-right: 2px dashed rgba(255, 255, 255, 0.7);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .split-segment:last-child {
      border-right: none;
    }

    .split-num {
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(4px);
      color: #fff;
      font-size: 0.8rem;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 20px;
      opacity: 0.7;
    }

    /* ── Dimensions ── */
    #dimensions-info {
      color: var(--muted);
      font-size: 0.8rem;
      font-family: monospace;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 5px 14px;
      align-self: center;
    }

    /* ── Results ── */
    .results-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }

    .results-title {
      font-size: 1.1rem;
      font-weight: 600;
    }

    #results-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 12px;
    }

    .result-card {
      position: relative;
      border-radius: 8px;
      overflow: hidden;
      aspect-ratio: 4/5;
      background: var(--surface);
      border: 1px solid var(--border);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
    }

    .result-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .result-card-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.2s;
      backdrop-filter: blur(2px);
    }

    .result-card:hover .result-card-overlay {
      opacity: 1;
    }

    .part-label {
      position: absolute;
      top: 8px;
      left: 8px;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
      color: #fff;
      font-size: 0.7rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 4px;
    }

    /* ── Toast ── */
    #toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--fg);
      color: var(--bg);
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 0.875rem;
      font-weight: 500;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      transition: transform 0.3s ease;
      z-index: 100;
      white-space: nowrap;
      pointer-events: none;
    }

    #toast.show {
      transform: translateX(-50%) translateY(0);
    }

    [hidden] {
      display: none !important;
    }

    @media (max-width: 600px) {
      main {
        padding: 24px 16px;
      }

      .controls-card {
        flex-direction: column;
        align-items: stretch;
      }

      .button-group {
        justify-content: flex-end;
      }

      #hero {
        padding: 24px 0 8px;
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="header-inner">
      <div class="logo-icon">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <circle cx="6" cy="6" r="3" />
          <circle cx="6" cy="18" r="3" />
          <line x1="20" y1="4" x2="8.12" y2="15.88" />
          <line x1="14.47" y1="14.48" x2="20" y2="20" />
          <line x1="8.12" y1="8.12" x2="12" y2="12" />
        </svg>
      </div>
      <span class="logo-text">ImageClipper</span>
    </div>
  </header>

  <main>
    <!-- Upload / Hero -->
    <div id="upload-section">
      <div id="hero">
        <h2>Split panoramas for <span class="highlight">Instagram</span></h2>
        <p>Upload a wide landscape photo and crop it into seamless carousel posts.</p>
      </div>

      <div id="drop-zone" role="button" tabindex="0" aria-label="Upload image">
        <div class="drop-icon">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" width="100%" height="100%">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
            <polyline points="17 8 12 3 7 8" />
            <line x1="12" y1="3" x2="12" y2="15" />
          </svg>
        </div>
        <div class="drop-title">Drop image here</div>
        <div class="drop-sub">or click to browse &mdash; JPG, PNG, WEBP</div>
        <input type="file" id="file-input" accept="image/*" />
      </div>
    </div>

    <!-- Editor (shown after upload) -->
    <div id="editor-section" hidden>
      <div class="controls-card">
        <div class="slider-group">
          <span class="slider-label">Parts</span>
          <span class="parts-count" id="parts-display">3</span>
          <input type="range" id="parts-slider" min="1" max="10" value="3" />
        </div>
        <div class="button-group">
          <button class="btn-ghost" id="reset-btn">&#x21BA; Reset</button>
          <button class="btn-primary" id="process-btn">&#x2702; Split</button>
        </div>
      </div>

      <div id="preview-wrapper">
        <img id="preview-img" alt="Preview" />
        <div id="split-overlay"></div>
      </div>

      <span id="dimensions-info"></span>
    </div>

    <!-- Results (shown after processing) -->
    <div id="results-section" hidden>
      <div class="results-header">
        <span class="results-title">Download Splits</span>
        <button class="btn-secondary" id="download-all-btn">&#x2B07; Download All</button>
      </div>
      <div id="results-grid"></div>
    </div>
  </main>

  <div id="toast" role="status" aria-live="polite"></div>

  <script>
    // ── State ──────────────────────────────────────────────────
    let currentFile = null;
    let currentParts = 3;
    let toastTimer = null;

    // ── Elements ───────────────────────────────────────────────
    const uploadSection = document.getElementById('upload-section');
    const editorSection = document.getElementById('editor-section');
    const resultsSection = document.getElementById('results-section');
    const dropZone = document.getElementById('drop-zone');
    const fileInput = document.getElementById('file-input');
    const previewImg = document.getElementById('preview-img');
    const splitOverlay = document.getElementById('split-overlay');
    const partsSlider = document.getElementById('parts-slider');
    const partsDisplay = document.getElementById('parts-display');
    const dimensionsInfo = document.getElementById('dimensions-info');
    const resultsGrid = document.getElementById('results-grid');
    const processBtn = document.getElementById('process-btn');
    const resetBtn = document.getElementById('reset-btn');
    const downloadAllBtn = document.getElementById('download-all-btn');

    // ── Upload ─────────────────────────────────────────────────
    dropZone.addEventListener('click', () => fileInput.click());
    dropZone.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') fileInput.click();
    });
    dropZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropZone.classList.add('drag-over');
    });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('drag-over');
      const f = e.dataTransfer.files[0];
      if (f && f.type.startsWith('image/')) loadFile(f);
    });
    fileInput.addEventListener('change', () => {
      if (fileInput.files[0]) loadFile(fileInput.files[0]);
    });

    function loadFile(file) {
      currentFile = file;
      resultsGrid.innerHTML = '';

      const url = URL.createObjectURL(file);
      previewImg.onload = () => {
        updateDimensionsInfo();
        updateOverlay();
        URL.revokeObjectURL(url);
      };
      previewImg.src = url;

      uploadSection.hidden = true;
      resultsSection.hidden = true;
      editorSection.hidden = false;
    }

    // ── Slider ─────────────────────────────────────────────────
    partsSlider.addEventListener('input', () => {
      currentParts = parseInt(partsSlider.value, 10);
      partsDisplay.textContent = currentParts;
      updateOverlay();
      updateDimensionsInfo();
    });

    function updateDimensionsInfo() {
      const w = previewImg.naturalWidth;
      const h = previewImg.naturalHeight;
      if (!w) return;
      dimensionsInfo.textContent = `${w} × ${h} px  •  each part ~${Math.floor(w / currentParts)} px wide`;
    }

    function updateOverlay() {
      splitOverlay.innerHTML = '';
      for (let i = 0; i < currentParts; i++) {
        const seg = document.createElement('div');
        seg.className = 'split-segment';
        seg.style.width = `${100 / currentParts}%`;

        const num = document.createElement('span');
        num.className = 'split-num';
        num.textContent = i + 1;
        seg.appendChild(num);

        splitOverlay.appendChild(seg);
      }
    }

    // ── Split ──────────────────────────────────────────────────
    processBtn.addEventListener('click', async () => {
      if (!currentFile) return;
      processBtn.disabled = true;
      processBtn.textContent = '…';

      try {
        const parts = await splitImage(currentFile, currentParts);
        renderResults(parts);
        showToast('Image split successfully!');
      } catch (err) {
        showToast('Error processing image.');
        console.error(err);
      } finally {
        processBtn.disabled = false;
        processBtn.textContent = '✂ Split';
      }
    });

    function splitImage(file, parts) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        const url = URL.createObjectURL(file);

        img.onload = () => {
          const results = [];
          const partWidth = Math.floor(img.width / parts);

          for (let i = 0; i < parts; i++) {
            const left = i * partWidth;
            const w = i === parts - 1 ? img.width - left : partWidth;

            const canvas = document.createElement('canvas');
            canvas.width = w;
            canvas.height = img.height;
            canvas.getContext('2d').drawImage(img, left, 0, w, img.height, 0, 0, w, img.height);
            results.push(canvas.toDataURL('image/jpeg', 0.95));
          }

          URL.revokeObjectURL(url);
          resolve(results);
        };

        img.onerror = () => {
          URL.revokeObjectURL(url);
          reject(new Error('Failed to load image'));
        };
        img.src = url;
      });
    }

    // ── Render results ─────────────────────────────────────────
    function renderResults(images) {
      resultsGrid.innerHTML = '';

      images.forEach((dataUrl, i) => {
        const card = document.createElement('div');
        card.className = 'result-card';

        const img = document.createElement('img');
        img.src = dataUrl;
        img.alt = `Part ${i + 1}`;

        const label = document.createElement('span');
        label.className = 'part-label';
        label.textContent = `Part ${i + 1}`;

        const overlay = document.createElement('div');
        overlay.className = 'result-card-overlay';

        const dlBtn = document.createElement('button');
        dlBtn.className = 'btn-primary';
        dlBtn.style.cssText = 'font-size:0.8rem;padding:7px 14px';
        dlBtn.textContent = '⬇ Save';
        dlBtn.addEventListener('click', () => downloadImage(dataUrl, i));

        overlay.appendChild(dlBtn);
        card.append(img, label, overlay);
        resultsGrid.appendChild(card);
      });

      resultsSection.hidden = false;
    }

    // ── Download ───────────────────────────────────────────────
    downloadAllBtn.addEventListener('click', () => {
      resultsGrid.querySelectorAll('img').forEach((img, i) => downloadImage(img.src, i));
    });

    function downloadImage(dataUrl, index) {
      const a = document.createElement('a');
      a.href = dataUrl;
      a.download = `split-${index + 1}.jpg`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }

    // ── Reset ──────────────────────────────────────────────────
    resetBtn.addEventListener('click', () => {
      currentFile = null;
      currentParts = 3;
      partsSlider.value = 3;
      partsDisplay.textContent = 3;
      previewImg.src = '';
      splitOverlay.innerHTML = '';
      resultsGrid.innerHTML = '';
      fileInput.value = '';
      editorSection.hidden = true;
      resultsSection.hidden = true;
      uploadSection.hidden = false;
      showToast('Reset');
    });

    // ── Toast ──────────────────────────────────────────────────
    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 2500);
    }
  </script>
</body>

</html>
